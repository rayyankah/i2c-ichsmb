<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1d">
  <title>i2c-ichsmb architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#ffffff"/>

  <!-- QNX guest -->
  <rect x="20" y="20" width="920" height="380" rx="10" fill="#eaf2fb" stroke="#7a9cc6"/>
  <text x="36" y="44" font-weight="bold">QNX OS 8.0 x86_64 (guest)</text>

  <g stroke="#333" fill="#fff">
    <rect x="40" y="60" width="160" height="50" rx="6"/>
    <rect x="220" y="60" width="200" height="50" rx="6"/>
    <rect x="440" y="60" width="160" height="50" rx="6"/>
    <rect x="700" y="60" width="220" height="50" rx="6"/>
  </g>
  <text x="120" y="82" text-anchor="middle" font-weight="bold">smbctl</text>
  <text x="120" y="100" text-anchor="middle" font-size="11">scan, registers, dump, temp</text>
  <text x="320" y="82" text-anchor="middle" font-weight="bold">thermd</text>
  <text x="320" y="100" text-anchor="middle" font-size="11">10 ms period, SCHED_FIFO 30</text>
  <text x="520" y="82" text-anchor="middle" font-weight="bold">any I2C client</text>
  <text x="520" y="100" text-anchor="middle" font-size="11">QNX's sample, t_xfer</text>
  <text x="810" y="82" text-anchor="middle" font-weight="bold">smb-supervisor</text>
  <text x="810" y="100" text-anchor="middle" font-size="11">starts the driver, restarts it</text>

  <line x1="320" y1="110" x2="320" y2="148" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="127" font-size="12">devctl(DCMD_I2C_*) on /dev/i2c0</text>
  <text x="330" y="142" font-size="12">a message, served at the client's priority</text>

  <line x1="740" y1="110" x2="604" y2="166" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="684" y="146" font-size="12">death pulse when the driver dies</text>

  <!-- driver process -->
  <rect x="40" y="150" width="560" height="230" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="56" y="171" font-weight="bold">i2c-ichsmb process</text>
  <g stroke="#555" fill="#f4f7fb">
    <rect x="60" y="180" width="520" height="40" rx="4"/>
    <rect x="60" y="228" width="520" height="40" rx="4"/>
    <rect x="60" y="276" width="520" height="40" rx="4"/>
    <rect x="60" y="324" width="520" height="40" rx="4"/>
  </g>
  <text x="74" y="205"><tspan font-weight="bold">libi2c-master</tspan>  QNX's resource manager for /dev/i2c0 (from the DDK)</text>
  <text x="74" y="253"><tspan font-weight="bold">driver/qnx</tspan>  PCI, I/O ports, interrupt pulse, slog2, abilities</text>
  <text x="74" y="301"><tspan font-weight="bold">driver/core/smb_map.c</tspan>  I2C request to one SMBus transaction</text>
  <text x="74" y="349"><tspan font-weight="bold">driver/core/smb_core.c</tspan>  runs it on the controller registers</text>

  <!-- services -->
  <g stroke="#333" fill="#fff">
    <rect x="660" y="196" width="260" height="50" rx="6"/>
    <rect x="660" y="280" width="260" height="64" rx="6"/>
  </g>
  <text x="790" y="217" text-anchor="middle" font-weight="bold">PCI server</text>
  <text x="790" y="235" text-anchor="middle" font-size="11">find the controller, I/O base, interrupt</text>
  <text x="790" y="301" text-anchor="middle" font-weight="bold">kernel</text>
  <text x="790" y="323" text-anchor="middle" font-size="11">interrupt 16 becomes a pulse on the</text>
  <text x="790" y="335" text-anchor="middle" font-size="11">driver's private channel</text>
  <line x1="580" y1="242" x2="658" y2="224" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="660" y1="304" x2="582" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- QEMU -->
  <rect x="20" y="420" width="920" height="150" rx="10" fill="#f8f2e6" stroke="#c4a46a"/>
  <text x="36" y="444" font-weight="bold">QEMU 10.2.1, q35 machine</text>
  <rect x="60" y="455" width="300" height="50" rx="6" fill="#fff" stroke="#333"/>
  <text x="210" y="476" text-anchor="middle" font-weight="bold">ICH9 SMBus controller</text>
  <text x="210" y="494" text-anchor="middle" font-size="11">PCI 0:1f.3 (pc machine: PIIX4)</text>

  <line x1="210" y1="364" x2="210" y2="453" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="218" y="405" font-size="12">in8 / out8 on I/O ports</text>
  <line x1="360" y1="470" x2="788" y2="346" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="540" y="458" font-size="12">interrupt (I/O APIC input 16)</text>

  <g stroke="#333" stroke-width="2">
    <line x1="210" y1="505" x2="210" y2="520"/>
    <line x1="210" y1="520" x2="815" y2="520"/>
    <line x1="485" y1="520" x2="485" y2="532"/>
    <line x1="635" y1="520" x2="635" y2="532"/>
    <line x1="815" y1="520" x2="815" y2="532"/>
  </g>
  <text x="222" y="536" font-size="12">SMBus</text>
  <g stroke="#333" fill="#fff">
    <rect x="420" y="532" width="130" height="30" rx="4"/>
    <rect x="570" y="532" width="130" height="30" rx="4"/>
    <rect x="720" y="532" width="190" height="30" rx="4"/>
  </g>
  <text x="485" y="552" text-anchor="middle">TMP105 at 0x48</text>
  <text x="635" y="552" text-anchor="middle">TMP105 at 0x49</text>
  <text x="815" y="552" text-anchor="middle">8 EEPROMs, 0x50 to 0x57</text>

  <!-- host -->
  <rect x="20" y="590" width="920" height="72" rx="10" fill="#ecf6ec" stroke="#83b483"/>
  <text x="36" y="613" font-weight="bold">Host: Ubuntu in WSL2</text>
  <g stroke="#333" fill="#fff">
    <rect x="60" y="622" width="300" height="30" rx="4"/>
    <rect x="420" y="622" width="300" height="30" rx="4"/>
  </g>
  <text x="210" y="642" text-anchor="middle">bench/bench: boot, deploy, ssh, test</text>
  <text x="570" y="642" text-anchor="middle">bench/qmp.py: set a sensor's temperature</text>
  <line x1="485" y1="622" x2="485" y2="564" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="493" y="598" font-size="12">QMP</text>
</svg>
