# SPDX-License-Identifier: Apache-2.0
# Runs the parts of the test suite that need no QNX licence:
#   1. host unit tests of driver/core against the software controller model
#   2. the same core on bare metal against QEMU's ICH9 SMBus controller
name: tests
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests/host
  qemu-baremetal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 qemu-system-x86 ovmf
      - run: bash tests/baremetal/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log
          path: tests/baremetal/build/serial.log
